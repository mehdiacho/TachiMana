# Minimal server-reference.conf for TachiMana's in-process extension runtime.
#
# AndroidCompat's config layer (vendored from Suwayomi) expects a `server` block on the classpath;
# upstream ships a large server-reference.conf, but the loader path only reads debugLogsEnabled at
# startup. Provide just that so GlobalConfigManager can initialize headlessly.
server {
  debugLogsEnabled = false
}
