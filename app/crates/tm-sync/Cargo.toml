[package]
name = "tm-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tm-db = { path = "../tm-db" }
tm-local = { path = "../tm-local" }
tm-backup = { path = "../tm-backup" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["net", "fs", "io-util", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
mdns-sd = "0.21"
if-addrs = "0.15"
percent-encoding = "2"
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tm-archive = { path = "../tm-archive" }
