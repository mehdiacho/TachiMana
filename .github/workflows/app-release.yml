name: App release (Rust)

# Builds the Rust app's installers and the extension helper zips (PLAN.md §P8.4–5).
# A tag `app-v<version>` (e.g. app-v0.2.0) publishes a release with all of them in the public
# repository mehdiacho/tachimana-releases; the app's updater and helper download read from there.
# Running it by hand builds everything as workflow artifacts; give it a version to publish that
# version too. When publishing, each build job puts its files straight onto a draft release and
# the last job publishes it, so a release does not depend on the account's artifact storage. The Kotlin app keeps its own `v*.*.*` tags and release.yml until P9.

on:
  push:
    tags: ["app-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish this version (e.g. 0.1.0) as a release; leave empty to only build"
        required: false
        default: ""
  # A PR that touches packaging builds everything once (no release) so a broken installer shows
  # up before a tag does.
  pull_request:
    paths:
      - ".github/workflows/app-release.yml"
      - "app/scripts/**"
      - "app/src-tauri/tauri.conf.json"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_EVENT_NAME}" = push ]; then v="${GITHUB_REF_NAME#app-v}"
          elif [ -n "${INPUT_VERSION}" ]; then v="${INPUT_VERSION}"
          else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # A pushed `app-v*` tag, or a manual run with a version (for when pushing tags is not possible).
          if { [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_EVENT_NAME}" = push ]; } || { [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ -n "${INPUT_VERSION}" ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # The draft the build jobs upload to. Published to the public releases repository, which the
  # app's updater and helper download read without signing in (this repository is private).
  # RELEASES_TOKEN is a fine-grained token with Contents read/write on that repository only.
  draft:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Add the RELEASES_TOKEN secret (see the comment above)"; exit 1; }
          gh release view "app-v$VERSION" --repo mehdiacho/tachimana-releases > /dev/null 2>&1 || \
            gh release create "app-v$VERSION" --repo mehdiacho/tachimana-releases --draft \
              --title "TachiMana $VERSION" \
              --notes "Installers for Windows (setup.exe, msi) and Linux (deb, AppImage), and the extension helper zips the app downloads on first use."

  ext-host:
    needs: [version, draft]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: gradle
      - name: Build the host
        shell: bash
        run: bash ./gradlew --no-daemon :ext-host:fatJar
      - name: Pack host + trimmed runtime
        shell: bash
        run: bash app/scripts/package-ext-host.sh ${{ matrix.platform }} dist
      - name: The packed runtime starts the host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helper" && cd "$RUNNER_TEMP/helper"
          unzip -q "$GITHUB_WORKSPACE/dist/tachimana-ext-host-linux-x64.zip"
          export TM_EXTHOST_TOKEN=0123456789abcdef0123456789abcdef
          ./runtime/bin/java -jar ext-host.jar --data-dir "$RUNNER_TEMP/d" --port 0 < <(sleep 30) > out 2> err &
          for i in $(seq 1 60); do grep -q '^TM_EXTHOST_READY port=' out && break; sleep 1; done
          port=$(sed -n 's/^TM_EXTHOST_READY port=\([0-9]*\).*/\1/p' out)
          test -n "$port" || { cat err; exit 1; }
          curl -sf -H "Authorization: Bearer $TM_EXTHOST_TOKEN" "http://127.0.0.1:$port/v1/health"
      - name: Add the files to the draft release
        if: needs.version.outputs.publish == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "app-v$VERSION" dist/* --repo mehdiacho/tachimana-releases --clobber
      # A build that isn't published keeps its files as an artifact for a day. The account's
      # artifact storage is small, so a full store must not fail the build.
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.publish != 'true'
        continue-on-error: true
        with:
          name: ext-host-${{ matrix.platform }}
          path: dist/*
          retention-days: 1

  app:
    needs: [version, draft]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 so the AppImage runs on older glibc too.
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Stamp the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # One number everywhere: Cargo (the About screen and the updater), tauri.conf (installers).
          sed -i.bak -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          node -e 'const f="src-tauri/tauri.conf.json";const fs=require("fs");const c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION.replace(/-.*/,"");fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")'
          grep -m1 '^version' Cargo.toml
      - run: npm ci
        working-directory: app/ui
      - name: Build installers
        run: ui/node_modules/.bin/tauri build --bundles ${{ matrix.bundles }}
      - name: Collect installers and checksums
        run: |
          mkdir -p ../dist
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} ../dist/ \;
          cd ../dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l
      - name: Add the files to the draft release
        if: needs.version.outputs.publish == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "app-v$VERSION" dist/* --repo mehdiacho/tachimana-releases --clobber
      # A build that isn't published keeps its files as an artifact for a day. The account's
      # artifact storage is small, so a full store must not fail the build.
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.publish != 'true'
        continue-on-error: true
        with:
          name: app-${{ runner.os }}
          path: dist/*
          retention-days: 1

  release:
    needs: [version, draft, ext-host, app]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release view "app-v$VERSION" --repo mehdiacho/tachimana-releases --json assets --jq '.assets[].name'
          gh release edit "app-v$VERSION" --repo mehdiacho/tachimana-releases --draft=false --latest
