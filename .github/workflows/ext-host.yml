name: ext-host

# Builds the Kotlin extension host the Rust app talks to (docs/rust-port/api.md) and runs its
# end-to-end self-test against the real Keiyoushi repo and MangaDex extension.

on:
  pull_request:
    paths:
      - "ext-host/**"
      - "extension/**"
      - "engine/source-api/**"
      - "android-compat/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/ext-host.yml"
  workflow_dispatch:

jobs:
  ext-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: gradle

      - name: Build the host
        shell: bash
        run: ./gradlew --no-daemon :ext-host:fatJar

      - name: Self-test (in-process server, real HTTP, real extension)
        shell: bash
        run: ./gradlew --no-daemon :ext-host:selfTest

      - name: Start-up contract (java -jar, ready line, bearer token, exit on stdin close)
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/exthost-data"
          export TM_EXTHOST_TOKEN=0123456789abcdef0123456789abcdef
          mkfifo "$RUNNER_TEMP/in" 2>/dev/null || true
          if [ -p "$RUNNER_TEMP/in" ]; then
            # Hold the host's stdin open through a FIFO so closing it can be tested.
            java -jar ext-host/build/ext-host/ext-host.jar --data-dir "$dir" --port 0 \
              < "$RUNNER_TEMP/in" > "$RUNNER_TEMP/out" 2> "$RUNNER_TEMP/err" &
            pid=$!
            exec 3> "$RUNNER_TEMP/in"
          else
            # Windows Git Bash has no FIFOs: keep stdin open with a sleeping writer instead.
            (sleep 600) | java -jar ext-host/build/ext-host/ext-host.jar --data-dir "$dir" --port 0 \
              > "$RUNNER_TEMP/out" 2> "$RUNNER_TEMP/err" &
            pid=$!
          fi
          for i in $(seq 1 60); do
            grep -q '^TM_EXTHOST_READY port=' "$RUNNER_TEMP/out" && break
            sleep 1
          done
          cat "$RUNNER_TEMP/out"
          port=$(sed -n 's/^TM_EXTHOST_READY port=\([0-9]*\).*/\1/p' "$RUNNER_TEMP/out")
          test -n "$port"
          test "$(wc -l < "$RUNNER_TEMP/out")" -eq 1
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/v1/health")
          echo "no token: $code"; test "$code" = 401
          curl -sf -H "Authorization: Bearer $TM_EXTHOST_TOKEN" "http://127.0.0.1:$port/v1/health"
          echo
          if [ -p "$RUNNER_TEMP/in" ]; then
            exec 3>&-   # close stdin: the host must exit by itself
            for i in $(seq 1 20); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then echo "host still running after stdin closed"; cat "$RUNNER_TEMP/err"; exit 1; fi
            echo "exited after stdin closed"
          else
            curl -sf -X POST -H "Authorization: Bearer $TM_EXTHOST_TOKEN" "http://127.0.0.1:$port/v1/shutdown"
            echo
            for i in $(seq 1 20); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then echo "host still running after /v1/shutdown"; cat "$RUNNER_TEMP/err"; exit 1; fi
            echo "exited after /v1/shutdown"
          fi

      - name: Upload the host
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ext-host
          path: ext-host/build/ext-host/
